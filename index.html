<style>
:root{
  --bg:#FAF7F2;
  --ink:#1B1A18;
  --muted:#6E6A63;
  --hair:#E4DED4;
  --accent:#6B9DC9;
  --warm:#C9B79A;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131211;
    --ink:#F2EEE7;
    --muted:#9A948B;
    --hair:#2C2A27;
    --accent:#8FBBE2;
    --warm:#B9A88C;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","Helvetica Neue",Arial,sans-serif;
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
}

.wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:clamp(2rem,7vw,5rem) 1.5rem;
  position:relative;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}
@media (prefers-reduced-motion:reduce){
  .mark,.rule,.soon{animation:none!important;opacity:1!important;transform:none!important}
}

.mark{
  font-size:clamp(1.9rem,7.5vw,3.4rem);
  font-weight:600;
  letter-spacing:.24em;
  text-indent:.24em;
  line-height:1.1;
  margin-bottom:clamp(1.2rem,3.2vw,1.75rem);
  opacity:0;
  animation:fadeIn 1.1s ease-out .1s forwards;
}

.rule{
  width:clamp(40px,8vw,64px);
  height:1px;
  background:var(--warm);
  margin:0 auto clamp(1.2rem,3.2vw,1.75rem);
  border:0;
  opacity:0;
  animation:fadeIn .9s ease-out .5s forwards;
}

.soon{
  font-size:clamp(.8125rem,2.2vw,.9375rem);
  font-weight:400;
  color:var(--muted);
  letter-spacing:.22em;
  text-indent:.22em;
  text-transform:uppercase;
  opacity:0;
  animation:fadeIn 1.1s ease-out .7s forwards;
}

footer{
  border-top:1px solid var(--hair);
  padding:1.6rem 1.5rem 2rem;
  text-align:center;
  font-size:.8125rem;
  line-height:1.7;
  color:var(--muted);
  letter-spacing:.02em;
}
footer .sep{opacity:.45;padding:0 .45rem}
@media (max-width:520px){
  footer .sep{display:none}
  footer span{display:block}
}
</style>
</head>
<body>

<main class="wrap">
  <h1 class="mark">SOFT RESET</h1>
  <hr class="rule">
  <p class="soon">Coming Soon</p>
</main>

<footer>
  <span>Soft Reset Ltd</span><span class="sep">·</span><span>Registered in England &amp; Wales</span>
</footer>

</body>
</html>
